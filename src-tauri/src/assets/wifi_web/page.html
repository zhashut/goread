<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>使用手机上传文件</title>
    <style>
/*__CSS_BOOTSTRAP__*/
/*__CSS_THEME__*/
/*__CSS_FILEUPLOAD__*/
/*__CSS_INDEX__*/
    </style>
  </head>
  <body>

    <div class="container">

      <div class="page-header">
        <h1>使用手机上传文件</h1>
      </div>

      欢迎使用文件上传工具，请在这里上传电脑将收到该文件

      <div id="alerts"></div>

      <div class="btn-toolbar">
        <button type="button" class="btn btn-primary fileinput-button" id="upload-file">
          <span class="glyphicon glyphicon-upload"></span> 上传文件
          <input id="fileupload" type="file" name="files[]" multiple>
        </button>
        <button type="button" class="btn btn-success" id="create-folder">
          <span class="glyphicon glyphicon-tag"></span> 创建分组
        </button>
        <button type="button" class="btn btn-default" id="reload">
          <span class="glyphicon glyphicon-refresh"></span> Refresh
        </button>
      </div>

      <div class="panel panel-default uploading">
        <div class="panel-heading">File Uploads in Progress</div>
        <table class="table table-striped"><tbody id="uploads"></tbody></table>
      </div>

      <div class="panel panel-default">
        <div class="panel-heading">
          <div class="form-inline">
            <label for="group-select">导入到分组：</label>
            <select id="group-select" class="form-control">
              <option value="">不分组</option>
            </select>
            <span class="help-block" style="display:inline; margin-left:8px;">分组与电脑书架同步</span>
          </div>
        </div>
        <table class="table table-striped"><tbody id="listing"></tbody></table>
      </div>

      GoRead 版权所有

      <p class="footer">GoRead 1.5.9</p>

    </div>

    <div class="modal fade" id="create-modal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <button type="button" class="close" data-dismiss="modal">&times;</button>
            <h4 class="modal-title">创建分组</h4>
          </div>
          <div class="modal-body">
            <p>请输入新分组的名称（将同步到电脑书架）：</p>
            <form onsubmit="return false">
              <input type="text" autocomplete="off" id="create-input">
            </form>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-default" data-dismiss="modal">取消</button>
            <button type="button" class="btn btn-primary" id="create-confirm">创建分组</button>
          </div>
        </div>
      </div>
    </div>

    <script>
//__PAGE_JS__
    </script>
  </body>
</html>
