[package]
name = "tauri-plugin-ios-bridge"
version = "0.1.0"
edition = "2021"
links = "tauri-plugin-ios-bridge"

[lib]
name = "tauri_plugin_ios_bridge"
path = "src/lib.rs"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
